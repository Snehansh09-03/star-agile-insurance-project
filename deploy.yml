---
- name: Configure Docker on Deployserver
  hosts: server
  become: true
  connection: ssh

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes

    - name: Install Python3 and Pip
      apt:
        name:
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Deploy Docker container
      command: docker run -itd -p 8080:8081 shivansh8068/insurance_staragile:1.0
